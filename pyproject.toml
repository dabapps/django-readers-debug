[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-readers-debug"
version = "0.0.4"
description = "A pretty-printer for debugging django-readers queryset functions"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "DabApps", email = "hello@dabapps.com" }]
dependencies = [
    "black",
    "django-readers",
]

[project.urls]
Homepage = "https://github.com/dabapps/django-readers-debug"
Changelog = "https://github.com/dabapps/django-readers-debug/releases"
Issues = "https://github.com/dabapps/django-readers-debug/issues"

[tool.setuptools.packages.find]
include = ["django_readers_debug*"]
